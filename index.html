<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Things</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="startMenu" class="overlay active">
            <h1 style="color: #3498db; margin-bottom: 10px;">SURVIVAL PRO</h1>
            <p style="margin-bottom: 30px; opacity: 0.8;">Drücke den Button zum Starten</p>
            <div class="volume-control">
                <label for="volumeSliderStart" style="margin-bottom: 10px; display: block;">Lautstärke: <span id="volumeValueStart">10</span>/10</label>
                <input type="range" id="volumeSliderStart" min="0" max="10" value="10" class="volume-slider" onchange="setVolume(this.value)" oninput="updateVolumeDisplay('Start', this.value)">
            </div>
            <button onclick="startGame()" style="margin-top: 20px;">Spiel Starten</button>
        </div>

        <div id="pauseMenu" class="overlay">
            <h1>PAUSE</h1>
            <div class="volume-control">
                <label for="volumeSliderPause" style="margin-bottom: 10px; display: block;">Lautstärke: <span id="volumeValuePause">10</span>/10</label>
                <input type="range" id="volumeSliderPause" min="0" max="10" value="10" class="volume-slider" onchange="setVolume(this.value)" oninput="updateVolumeDisplay('Pause', this.value)">
            </div>
            <button onclick="resumeGame()" style="margin-top: 20px;">Fortfahren (ESC)</button>
            <button onclick="resetGame()">Neustart</button>
        </div>

        <div id="upgradeMenu" class="overlay">
            <h2 style="color: #f39c12;">UPGRADE BEREIT!</h2>
            <p style="margin-bottom: 20px;">Wähle einen Bonus:</p>
            <button onclick="selectUpgrade('speed')">1. Tempo</button>
            <button onclick="selectUpgrade('slow')">2. Slow-Mo</button>
            <button onclick="selectUpgrade('life')">3. Leben</button>
        </div>

        <div id="gameOverMenu" class="overlay">
            <h1 style="color: #e74c3c;">GAME OVER</h1>
            <p id="finalScoreDisplay" style="font-size: 24px; margin-bottom: 20px;"></p>
            <p id="highScoreDisplay" style="font-size: 20px; margin-bottom: 20px; color: #f39c12;"></p>
            <button onclick="resetGame()">Neustart (R)</button>
        </div>

        <div id="sidebar">
            <h2 style="margin-top: 0;">Status</h2>
            <div class="stat">Score: <span id="val-score">0</span></div>
            <div class="stat">Highscore: <span id="val-highscore">0</span></div>
            <div class="stat">Tempo: <span id="val-speed">400</span></div>
            <div class="stat">Welle: <span id="val-wave">1</span></div>
            <div class="stat">Leben: <span id="val-lives">❤️</span></div>
            <div class="stat">
                Energie: 
                <div id="energy-bar">
                    <div id="energy-fill"></div>
                </div>
            </div>

            <div style="margin-top: 30px; border-top: 1px solid #444; padding-top: 15px;">
                <p style="font-size: 13px; font-weight: bold; color: #3498db; margin-bottom: 5px;">STEUERUNG:</p>
                <p style="font-size: 12px; opacity: 0.8; line-height: 1.6;">
                    <strong>WASD:</strong> Bewegen<br>
                    <strong>Leertaste halten:</strong> Slow-Mo<br>
                    <strong>Pfeile + Leertaste:</strong> Port (30 E)<br>
                    <strong>Taste Shift:</strong> Spezial (50 E)<br>
                    <strong>ESC:</strong> Pause
                </p>
            </div>
        </div>
        
        </div>

    <audio id="backgroundMusic" loop>
        <source src="sound/background.mp3" type="audio/mpeg">
    </audio>

    <script src="ui.js"></script>
    <script src="input.js"></script>
    <script src="entities.js"></script>
    <script src="game.js"></script>
</body>
</html>
